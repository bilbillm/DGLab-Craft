buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
        maven { url = 'https://libraries.minecraft.net/' }
    }
    dependencies {
        // ForgeGradle 1.2 refuses Forge 1.8.9: ForgeUserPlugin hard-fails with
        // "ForgeGradle 1.2 only supports Forge 1.8 before 11.14.3.1503".
        // Forge 11.14.3+ (i.e. 1.8.8/1.8.9) switched to the merged-srg userdev
        // layout, which is handled by ForgeGradle 2.x - the official 1.8.9 toolchain.
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

// The legacy S3 endpoints ForgeGradle points at by default are dead; redirect the
// download tasks to the current Mojang CDN (URLs from the official 1.8.9 version manifest).
tasks.downloadClient { url = 'https://launcher.mojang.com/v1/objects/3870888a6c3d349d3771a3e9d16c9bf5e076b908/client.jar' }
tasks.downloadServer { url = 'https://launcher.mojang.com/v1/objects/b58b2ceb36e01bcd8dbf49c8fb66c55a9f0676cd/server.jar' }
tasks.getVersionJson { url = 'https://piston-meta.mojang.com/v1/packages/d546f1707a3f2b7d034eece5ea2e311eda875787/1.8.9.json' }
tasks.getAssetIndex { url = 'https://launchermeta.mojang.com/v1/packages/f6ad102bcaa53b1a58358f16e376d548d44933ec/1.8.json' }

version = mod_version
group = 'com.lumoren.dglabcraft'
archivesBaseName = "DGLabCraft-${minecraft_version}"

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
    // ForgeGradle 2.x takes "<mcVersion>-<forgeVersion>" and appends "<mcVersion>"
    // itself when resolving net.minecraftforge:forge:<ver>:userdev.
    version = "${minecraft_version}-${forge_version}"
    runDir = "run"
    mappings = "${mapping_channel}_${mapping_version}"
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

configurations {
    shade
    compile.extendsFrom shade
}

dependencies {
    // Java-WebSocket 1.4+ depends on SLF4J, which the legacy LaunchClassLoader
    // does not reliably load from a shaded mod jar.
    shade 'org.java-websocket:Java-WebSocket:1.3.9'
    shade('com.google.zxing:core:3.5.1') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version
    inputs.property 'mod_id', mod_id
    inputs.property 'mod_name', mod_name
    inputs.property 'mod_description', mod_description
    inputs.property 'mod_authors', mod_authors
    inputs.property 'mod_license', mod_license

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        include 'pack.mcmeta'
        expand([
                version        : project.version,
                mcversion      : minecraft_version,
                mod_id         : mod_id,
                mod_name       : mod_name,
                mod_description: mod_description,
                mod_authors    : mod_authors,
                mod_license    : mod_license
        ])
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
        exclude 'pack.mcmeta'
    }
}

sourceSets {
    test {
        java.srcDirs = []
        resources.srcDirs = []
    }
}

jar {
    archiveName = "DGLabCraft-${minecraft_version}-${project.version}.jar"
    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    exclude 'META-INF/versions/**', 'module-info.class'
    manifest {
        attributes([
                'Specification-Title'    : mod_id,
                'Specification-Vendor'   : mod_authors,
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.version,
                'Implementation-Vendor'  : mod_authors
        ])
    }
}
