plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.17'
}

version = mod_version
group = 'com.lumoren.dglabcraft'

base {
    archivesName = 'dglab-craft'
}

// Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// NeoForge configuration
neoForge {
    version = '21.1.61'
}

repositories {
    mavenCentral()
}

dependencies {
    // NeoForge 依赖
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    // 开发环境依赖
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'
    implementation('com.google.zxing:core:3.5.1') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }

    // jarJar 打包 - 保留 exclude commons-logging 和 jarJar 配置
    jarJar(group: 'org.java-websocket', name: 'Java-WebSocket', version: '[1.5.4,2.0)') {
        // 保留排除 commons-logging
    }
    jarJar(group: 'com.google.zxing', name: 'core', version: '[3.5.1,4.0)') {
        // 保留排除 commons-logging (通过上面 implementation 的 exclude 已处理)
    }
}

// 配置 jar 任务
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 将 jarJar 绑定到默认的 build 流程中
build.dependsOn 'jarJar'
