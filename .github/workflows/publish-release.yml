name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub release tag to publish"
        required: true
        default: "v1.1.1"
      release_type:
        description: "CurseForge release type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - beta
          - alpha
      target_minecraft:
        description: "Only publish this Minecraft version"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - "1.16.5"
          - "1.18.2"
          - "1.19.2"
          - "1.20.1"
          - "1.21.1"
          - "1.21.4"

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Minecraft ${{ matrix.minecraft }} ${{ matrix.loader }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.16.5"
            loader: Forge
            java: "8"
            game-version: "Minecraft 1.16:1.16.5"
            artifact-suffix: "-Forge"
          - minecraft: "1.16.5"
            loader: Fabric
            java: "8"
            game-version: "Minecraft 1.16:1.16.5"
            artifact-suffix: "-Fabric"
          - minecraft: "1.18.2"
            loader: Forge
            java: "17"
            game-version: "Minecraft 1.18:1.18.2"
            artifact-suffix: ""
          - minecraft: "1.19.2"
            loader: Forge
            java: "17"
            game-version: "Minecraft 1.19:1.19.2"
            artifact-suffix: ""
          - minecraft: "1.20.1"
            loader: Forge
            java: "17"
            game-version: "Minecraft 1.20:1.20.1"
            artifact-suffix: ""
          - minecraft: "1.21.1"
            loader: NeoForge
            java: "21"
            game-version: "Minecraft 1.21:1.21.1"
            artifact-suffix: ""
          - minecraft: "1.21.4"
            loader: NeoForge
            java: "21"
            game-version: "Minecraft 1.21:1.21.4"
            artifact-suffix: ""
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || (github.event.release.prerelease && 'beta' || 'release') }}
      MOD_VERSION: "1.1.1"

    steps:
      - name: Validate release and secret
        if: github.event_name == 'release' || inputs.target_minecraft == 'all' || inputs.target_minecraft == matrix.minecraft
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RELEASE_TAG}" != "v${MOD_VERSION}" ]; then
            echo "::error::This workflow publishes v${MOD_VERSION}; received ${RELEASE_TAG}"
            exit 1
          fi
          if [ -z "${CF_API_TOKEN}" ]; then
            echo "::error::Missing CF_API_TOKEN repository secret"
            exit 1
          fi

      - name: Checkout release metadata
        if: github.event_name == 'release' || inputs.target_minecraft == 'all' || inputs.target_minecraft == matrix.minecraft
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download exact GitHub release jar
        if: github.event_name == 'release' || inputs.target_minecraft == 'all' || inputs.target_minecraft == matrix.minecraft
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="DGLabCraft-${{ matrix.minecraft }}-${MOD_VERSION}${{ matrix.artifact-suffix }}.jar"
          mkdir -p release-assets
          gh release download "${RELEASE_TAG}" --pattern "${artifact}" --dir release-assets
          test -f "release-assets/${artifact}"
          echo "path=release-assets/${artifact}" >> "${GITHUB_OUTPUT}"

      - name: Verify jar metadata
        if: github.event_name == 'release' || inputs.target_minecraft == 'all' || inputs.target_minecraft == matrix.minecraft
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ steps.artifact.outputs.path }}"
          unzip -t "${{ steps.artifact.outputs.path }}" >/dev/null

      - name: Read CurseForge changelog
        if: github.event_name == 'release' || inputs.target_minecraft == 'all' || inputs.target_minecraft == matrix.minecraft
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          body="$(awk -v version="${MOD_VERSION}" '
            BEGIN { in_section = 0 }
            index($0, "## [" version "]") == 1 { in_section = 1 }
            in_section && $0 == "---" { exit }
            in_section { print }
          ' changelog.txt)"
          if [ -z "${body}" ]; then
            body="DGLab Craft ${MOD_VERSION}"
          fi
          delimiter="CHANGELOG_$(date +%s%N)"
          {
            echo "changelog<<${delimiter}"
            printf '%s\n' "${body}"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload jar to CurseForge
        if: github.event_name == 'release' || inputs.target_minecraft == 'all' || inputs.target_minecraft == matrix.minecraft
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CF_API_TOKEN }}
          project_id: "1538053"
          game_endpoint: minecraft
          file_path: ${{ steps.artifact.outputs.path }}
          game_versions: ${{ matrix.game-version }},Java ${{ matrix.java }},${{ matrix.loader }}
          release_type: ${{ env.RELEASE_TYPE }}
          display_name: DGLabCraft ${{ env.MOD_VERSION }} for Minecraft ${{ matrix.minecraft }} ${{ matrix.loader }}
          changelog: ${{ steps.notes.outputs.changelog }}
          changelog_type: markdown
